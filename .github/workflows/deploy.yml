name: Deploy Go Fiber Application

on:
  push:
    branches:
      - admin
      - admin_beramal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Deploy to Server (via SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $VPS_PORT -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Tentukan direktori tujuan berdasarkan branch yang di-push
          if [ "$BRANCH_NAME" = "admin_beramal" ]; then
            TARGET_DIR="/var/www/beramal-new/admin"
          else
            TARGET_DIR="/var/www/akber-new/admin"
          fi

          # Eksekusi perintah di VPS dengan mengirimkan variabel TARGET_DIR dan BRANCH_NAME
          ssh -p $VPS_PORT -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST "TARGET_DIR=$TARGET_DIR BRANCH_NAME=$BRANCH_NAME bash -s" << 'EOF'
            set -e
            echo "==> Deploying branch $BRANCH_NAME to $TARGET_DIR..."

            cd "$TARGET_DIR"
            git pull origin "$BRANCH_NAME"
            yarn
            yarn build-only
          EOF