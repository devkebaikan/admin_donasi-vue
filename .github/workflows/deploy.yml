name: Deploy Go Fiber Application

on:
  push:
    branches:
      - admin # Memicu pipeline ketika ada push ke branch admin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Menggunakan versi terbaru yang lebih stabil dan aman

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # Sesuaikan dengan versi Go yang Anda gunakan

      # Opsional: Menjalankan test atau linter sebelum deploy untuk memastikan code aman
      # - name: Run Tests
      #   run: |
      #     go test -v ./...

      - name: Deploy to Server (via SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Buat direktori .ssh jika belum ada
          mkdir -p ~/.ssh
          
          # Simpan private key ke file lokal runner
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Tambahkan host & port ke known_hosts untuk keamanan
          ssh-keyscan -p $VPS_PORT -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Melakukan koneksi SSH dengan port kustom dan eksekusi perintah di VPS
          ssh -p $VPS_PORT -i ~/.ssh/id_rsa $VPS_USER@$VPS_HOST << 'EOF'
            # Masuk ke direktori projek di VPS
            cd /var/www/akber-new/admin/
            
            # Tarik kode terbaru dari branch admin
            git pull
            
            yarn
            yarn build-only
          EOF